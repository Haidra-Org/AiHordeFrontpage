<!doctype html>
<html lang="en">
  <head>
    <!-- basic attributes -->
    <meta charset="utf-8" />
    <title>AI Horde</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The link preview for pages that set no meta of their own; pages that do replace these. -->
    <meta
      property="og:image"
      content="https://assets.aihorde.net/promo/site.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://assets.aihorde.net/promo/site.jpg"
    />

    <!-- GitHub Pages SPA redirect script -->
    <script>
      // Single Page Apps for GitHub Pages
      // Store the path from the query string in session storage
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <!-- Theme initialization (prevent FOUC) -->
    <script>
      // Apply theme before Angular hydration to prevent flash of unstyled content
      // This is critical for SSR/pre-rendering
      (function () {
        try {
          var theme = localStorage.getItem("theme-preference") || "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          // If localStorage fails, default to dark mode (current default)
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- The ground the page is painted on until the app's own stylesheet is
         ready. Routes drawn in the browser show this shell for as long as the
         bundle takes, and a light rectangle is the wrong answer for a reader who
         asked for the dark theme: the class the script above just set picks the
         colour here exactly as it does in the stylesheet. The mark is the site
         saying which site it is while there is nothing else to say. -->
    <style>
      html {
        --boot-ground: #f9fafb;
        color-scheme: light;
      }
      html.dark {
        --boot-ground: #1f2937;
        color-scheme: dark;
      }
      html,
      body {
        min-height: 100%;
        background: var(--boot-ground);
      }
      body {
        margin: 0;
      }
      .boot-mark {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .boot-mark img {
        width: 88px;
        max-width: 30vw;
        height: auto;
        opacity: 0.14;
      }
    </style>

    <!-- The shell's mark is the only thing on screen until the bundle lands, so
         it is asked for ahead of the bundle rather than behind it. -->
    <link
      rel="preload"
      as="image"
      href="assets/img/logo.png"
      fetchpriority="high"
    />

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#2d89ef" />
    <!-- The canvas the app is drawn on, so the browser's own chrome and the
         installed window's title bar continue the page rather than cut it. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#eceef3"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1115"
    />

    <!-- Installed on iOS, where the manifest is not read: the same standalone
         window, name and canvas the manifest asks for elsewhere. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Horde" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root>
      <!-- The shell, and only the shell: the app replaces everything in here
           when it mounts, and a drawing of the page that is coming would be a
           guess at a layout that depends on what the reader chose last. -->
      <div class="boot-mark" aria-hidden="true">
        <img src="assets/img/logo.png" alt="" width="393" height="455" />
      </div>
    </app-root>
  </body>
</html>
