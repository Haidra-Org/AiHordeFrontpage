<label
  class="hd-switch hd-switch-row toggle-check"
  [class.toggle-check--unset]="triState() && isNull()"
  for="input{{ random() }}"
>
  <span class="toggle-check-name">
    {{ description() }}
    <ng-content />
  </span>
  @if (triState()) {
    <span
      class="hd-badge toggle-check-unset"
      [class.toggle-check-unset--hidden]="!isNull()"
      >{{ "styles.form.unset" | transloco }}</span
    >
  }
  <input
    type="checkbox"
    id="input{{ random() }}"
    [checked]="isChecked()"
    [disabled]="disabled()"
    (click)="onCheckboxClick($event)"
    (change)="!triState() ? onInputChange(input.checked) : null"
    (blur)="onBlur()"
    #input
  />
  <span
    class="hd-switch-track"
    [class.toggle-check-track--unset]="triState() && isNull()"
  >
    <span
      class="hd-switch-thumb"
      [class.toggle-check-thumb--unset]="triState() && isNull()"
    ></span>
  </span>
</label>
