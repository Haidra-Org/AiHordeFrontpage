<div class="alchemy-image-input">
  <div
    class="gs-seg"
    role="group"
    [attr.aria-label]="'alchemy.steps.source' | transloco"
  >
    <button
      type="button"
      class="gs-seg-opt"
      [disabled]="disabled()"
      [attr.aria-pressed]="mode() === 'url'"
      (click)="setMode('url')"
    >
      <app-icon name="globe-alt" class="gs-ico-sm" />
      {{ "alchemy.image_input.tab_url" | transloco }}
    </button>
    <button
      type="button"
      class="gs-seg-opt"
      [disabled]="disabled()"
      [attr.aria-pressed]="mode() === 'upload'"
      (click)="setMode('upload')"
    >
      <app-icon name="arrow-up" class="gs-ico-sm" />
      {{ "alchemy.image_input.tab_upload" | transloco }}
    </button>
  </div>

  @if (mode() === "url") {
    <div>
      <label class="gs-slabel" for="alchemy-image-url">
        {{ "alchemy.image_input.url_label" | transloco }}
      </label>
      <input
        id="alchemy-image-url"
        type="url"
        class="gs-input mt-1"
        [class.gs-field--invalid]="error() !== null"
        [attr.aria-invalid]="error() !== null ? 'true' : null"
        autocomplete="off"
        [disabled]="disabled()"
        [value]="urlValue()"
        [placeholder]="'alchemy.image_input.url_placeholder' | transloco"
        (input)="onUrlInput($any($event.target).value)"
      />
      <p class="gs-sublabel mt-1">
        {{ "alchemy.image_input.url_hint" | transloco }}
      </p>
    </div>
  } @else {
    <label
      class="gs-add-tile"
      for="alchemy-image-file"
      [class.gs-chip--active]="dragActive()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      @if (encoding()) {
        <app-icon name="spinner" class="gs-ico-sm gs-spin" />
        <span class="gs-add-tile-title">{{
          "generate.source.encoding" | transloco
        }}</span>
      } @else {
        <app-icon name="photo" class="gs-ico-sm" />
        <span class="gs-add-tile-title">{{
          "generate.source.upload_prompt" | transloco
        }}</span>
        <span class="gs-add-tile-sub">{{
          "alchemy.image_input.upload_hint" | transloco
        }}</span>
      }
      <input
        id="alchemy-image-file"
        type="file"
        accept="image/*"
        class="sr-only"
        [disabled]="disabled() || encoding()"
        (change)="onFileSelected($event)"
      />
    </label>
  }

  @if (error()) {
    <p class="gs-warn mt-1">{{ error()! | transloco }}</p>
  }

  @if (previewSrc(); as src) {
    <div class="alchemy-image-input__preview">
      <img
        [src]="src"
        alt="{{ 'alchemy.image_input.preview_alt' | transloco }}"
      />
      <div class="alchemy-image-input__preview-meta">
        @if (encodedInfo(); as info) {
          <span class="gs-op-badge"
            >{{ info.width }}×{{ info.height }} · webp</span
          >
        }
        <button
          type="button"
          class="gs-btn gs-btn--dense"
          [disabled]="disabled()"
          (click)="clear()"
        >
          {{ "generate.source.clear_image" | transloco }}
        </button>
      </div>
    </div>
  }
</div>
