<section class="section-primary">
  <div class="container-page-header">
    <div class="place-center">
      <h1 class="details-title">
        {{ headingKey() | transloco }}
      </h1>
      @if (activeTab(); as tab) {
        <app-page-intro
          [lead]="true"
          [pageKey]="tab.pageKey"
          [readMoreLink]="tab.readMoreLink"
          [prose]="tab.prose ?? false"
        />
      }
    </div>
  </div>
</section>

<section class="section-secondary">
  <div class="container-page-content">
    <div class="details-shell">
      <app-volunteer-cta-banner />

      <nav
        class="details-nav hd-subtabs"
        [appStickyHeader]="10"
        [attr.aria-label]="'details.title' | transloco"
      >
        <div class="hd-subtabs-scroll">
          @for (tab of tabs; track tab.path) {
            <a
              class="hd-subtab"
              [routerLink]="tab.path"
              routerLinkActive="hd-subtab--active"
              #tabLink="routerLinkActive"
              [attr.aria-current]="tabLink.isActive ? 'page' : null"
            >
              <app-icon class="icon-sm" [name]="tab.icon" />
              {{ tab.labelKey | transloco }}
            </a>
          }
        </div>
      </nav>

      <div class="details-panel">
        <router-outlet />
      </div>
    </div>
  </div>
</section>
