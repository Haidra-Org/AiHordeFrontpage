<!-- The area being read, plus area and studio wayfinding. Both are absent on a
     URL that names no area, which is `/docs` itself on its way to the one area
     there is. -->
@if (area(); as current) {
  <!-- This chrome and the page row are one block, so on a phone they pin and
       scroll together. While pinned it takes its place in the sticky registry,
       which is where it gets its own `top` from and how the page under it
       knows how much is standing over it. -->
  <div class="gs-docs-chrome" [appStickyHeader]="chromeOrder()">
    <!-- One row of wayfinding: which area is being read, the pages of that
         area, and the way back to its studio. One scrolling row rather than a
         wrapping one, so it costs one line of every page it sits on at any
         width, and a phone keeps the area switch instead of losing it. -->
    <nav
      class="gs-hub-nav"
      [class.gs-hub-nav--image]="current.id === 'image'"
      [class.gs-hub-nav--alchemy]="current.id === 'alchemy'"
      [attr.aria-label]="'generate.learn.nav_label' | transloco"
    >
      <div
        class="gs-docs-areas"
        role="group"
        [attr.aria-label]="'docs.area_switcher_label' | transloco"
      >
        @for (entry of areaBridgeEntries; track entry.id) {
          <a
            class="gs-docs-area-link"
            [class.gs-docs-area-link--image]="entry.id === 'image'"
            [class.gs-docs-area-link--alchemy]="entry.id === 'alchemy'"
            [routerLink]="entry.docsLink"
            [attr.aria-current]="isCurrentArea(entry.id) ? 'page' : null"
          >
            <app-icon [name]="entry.icon" class="gs-docs-area-icon" />
            <span>{{ entry.labelKey | transloco }}</span>
          </a>
        }
      </div>
      <span class="gs-hub-nav-divider" aria-hidden="true"></span>
      @for (entry of entries(); track entry.activePath) {
        <!-- The entry the reader is on is said once, by `aria-current`, and the
           underline is drawn from it: a second class saying the same thing is a
           second place for the two to disagree. -->
        <a
          class="gs-hub-nav-link"
          [routerLink]="entry.link"
          [attr.aria-current]="isActive(entry) ? 'page' : null"
        >
          <app-icon [name]="entry.icon" class="gs-hub-nav-mark" />
          <span class="gs-hub-nav-label">{{ entry.labelKey | transloco }}</span>
        </a>
      }
      <!-- The way back to the studio this area documents, at the end of the
           row so it reads as the exit rather than as one more page. -->
      <a
        class="gs-docs-studio-link"
        [class.gs-docs-studio-link--image]="current.id === 'image'"
        [class.gs-docs-studio-link--alchemy]="current.id === 'alchemy'"
        [routerLink]="studioLinkFor(current.id)"
        [attr.aria-label]="'docs.studio_jump_label' | transloco"
      >
        <app-icon [name]="current.icon" class="gs-docs-studio-icon" />
        <span>{{ "docs.studio_jump" | transloco }}</span>
        <app-icon name="arrow-right" class="gs-docs-studio-arrow" />
      </a>
    </nav>
  </div>
}

<div class="gs-learn-outlet">
  <router-outlet />
</div>

<!-- The reader arrives here from the studio's bottom bar on a phone, so the bar
     stays with them: without it, reading a page is a one-way door and the way
     back has to be hunted for. Last in the page's reading order, because it is
  the way out rather than the way in, and only ever the bottom bar: up there
  this area has its own wayfinding rows. -->
@if (showToolTabs()) {
  <app-gs-tool-tabs [wideRow]="false" [docsCurrent]="true" />
}
