<!-- The area being read, and the way back out of it. Both are absent on a URL
     that names no area, which is `/docs` itself on its way to the one area
     there is. -->
@if (area(); as current) {
  <!-- Crumbs and tabs are one block of chrome, so on a phone they pin and
       scroll together: pinning the tabs alone left the crumbs sliding under
       them, which read as a broken window. While it is pinned it takes its
       place in the sticky registry, which is where it gets its own `top` from
       and how the page under it knows how much is standing over it. -->
  <div class="gs-docs-chrome" [appStickyHeader]="chromeOrder()">
    <nav
      class="gs-docs-crumbs"
      [attr.aria-label]="'docs.breadcrumb_label' | transloco"
    >
      <a class="gs-docs-crumb" [routerLink]="docsRoot">
        {{ "docs.title" | transloco }}
      </a>
      <span class="gs-docs-crumb-sep" aria-hidden="true">/</span>
      <span class="gs-docs-crumb gs-docs-crumb--here" aria-current="page">
        {{ current.labelKey | transloco }}
      </span>
    </nav>

    <!-- One scrolling row rather than a wrapping one: an area is a short list of
       pages and it should cost one line of every page it sits on. -->
    <nav
      class="gs-hub-nav"
      [attr.aria-label]="'generate.learn.nav_label' | transloco"
    >
      @for (entry of entries(); track entry.activePath) {
        <!-- The entry the reader is on is said once, by `aria-current`, and the
           underline is drawn from it: a second class saying the same thing is a
           second place for the two to disagree. -->
        <a
          class="gs-hub-nav-link"
          [routerLink]="entry.link"
          [attr.aria-current]="isActive(entry) ? 'page' : null"
        >
          <app-icon [name]="entry.icon" class="gs-hub-nav-mark" />
          <span class="gs-hub-nav-label">{{ entry.labelKey | transloco }}</span>
        </a>
      }
    </nav>
  </div>
}

<div class="gs-learn-outlet">
  <router-outlet />
</div>

<!-- The reader arrives here from the studio's bottom bar on a phone, so the bar
     stays with them: without it, reading a page is a one-way door and the way
     back has to be hunted for. Last in the page's reading order, because it is
     the way out rather than the way in, and only ever the bottom bar: up there
     this area has crumbs and its own row of pages. -->
@if (showToolTabs()) {
  <app-gs-tool-tabs [wideRow]="false" [docsCurrent]="true" />
}
