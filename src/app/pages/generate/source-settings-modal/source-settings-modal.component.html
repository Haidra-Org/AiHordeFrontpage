<div
  class="gs-modal-overlay"
  (click)="onBackdrop($event)"
  (keydown.escape)="cancel()"
  tabindex="-1"
>
  <div
    class="gs-modal-panel gs-modal-panel--sm gs-fadeup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gs-source-import-title"
  >
    <div class="gs-modal-header">
      <div id="gs-source-import-title" class="gs-modal-title">
        <app-icon name="photo" class="gs-ico-sm" />
        {{ "generate.source.import_title" | transloco }}
      </div>
      <button
        type="button"
        class="gs-modal-close"
        (click)="cancel()"
        [attr.aria-label]="'generate.results.close' | transloco"
      >
        <app-icon name="x-mark" class="gs-ico-sm" />
      </button>
    </div>

    <div class="gs-modal-body gs-options-rows">
      <button
        #firstRow
        type="button"
        class="gs-opt-row"
        (click)="choose('source')"
      >
        <app-icon name="photo" class="gs-ico-sm" aria-hidden="true" />
        <span class="gs-opt-text">
          <span class="gs-opt-label">{{
            "generate.source.import_source_label" | transloco
          }}</span>
          <span class="gs-opt-hint">{{
            "generate.source.import_source_hint" | transloco
          }}</span>
        </span>
      </button>
      <button type="button" class="gs-opt-row" (click)="choose('both')">
        <app-icon name="squares-2x2" class="gs-ico-sm" aria-hidden="true" />
        <span class="gs-opt-text">
          <span class="gs-opt-label">{{
            "generate.source.import_both_label" | transloco
          }}</span>
          <span class="gs-opt-hint">{{
            "generate.source.import_both_hint" | transloco
          }}</span>
        </span>
      </button>
      <button type="button" class="gs-opt-row" (click)="choose('settings')">
        <app-icon
          name="adjustments-horizontal"
          class="gs-ico-sm"
          aria-hidden="true"
        />
        <span class="gs-opt-text">
          <span class="gs-opt-label">{{
            "generate.source.import_settings_label" | transloco
          }}</span>
          <span class="gs-opt-hint">{{
            "generate.source.import_settings_hint" | transloco
          }}</span>
        </span>
      </button>
    </div>
  </div>
</div>
