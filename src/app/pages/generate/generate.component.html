<div class="gen-studio gs-workspace" [class.gs-workspace--full]="!embedded()">
  <!-- Left: control panel -->
  <section class="gs-panel">
    <app-generate-form
      class="gs-fill"
      [form]="form"
      [models]="models()"
      [kudos]="kudos()"
      [estimating]="estimating()"
      [forcedParams]="forcedParams()"
      [styleGroups]="styleGroups()"
      (create)="onCreate()"
    >
      <app-generate-source-image
        generateSourceImage
        [form]="form"
        [showValidation]="sourceValidationVisible()"
        (stateChange)="onSourceState($event)"
      />
    </app-generate-form>
  </section>

  <!-- Right: results pane -->
  <section class="gs-results">
    <app-generate-results-panel class="gs-fill" />
  </section>
</div>
