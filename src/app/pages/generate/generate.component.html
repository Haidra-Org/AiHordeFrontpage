<div
  class="gen-studio gs-workspace"
  [class.gs-workspace--full]="!embedded()"
  [class.gs-workspace--wide]="!embedded() && panelSize() === 'double'"
  [class.gs-workspace--max]="!embedded() && panelSize() === 'full'"
  appStudioImageDrop
  #imageDrop="studioImageDrop"
  (imageFile)="onDroppedImage($event)"
  (rejected)="onRejectedImage()"
>
  <!-- Keyboard users land in the control panel first; the results pane is a long
       scroll away past every setting, so it gets a skip link. -->
  <a class="gs-skip" href="#generate-results" (click)="skipToResults($event)">
    {{ "generate.skip_to_results" | transloco }}
  </a>

  <!-- Left: control panel -->
  <section class="gs-panel">
    <app-generate-form
      class="gs-fill"
      [form]="form"
      [models]="models()"
      [kudos]="kudos()"
      [estimating]="estimating()"
      [forcedParams]="forcedParams()"
      [styleGroups]="styleGroups()"
      [panelSize]="panelSize()"
      [expandable]="!embedded()"
      [promptHistory]="promptHistory()"
      [qrSupported]="qrSupported()"
      [modelBaseline]="modelBaseline()"
      [modelRequirements]="modelRequirements()"
      (panelSizeChange)="panelSize.set($event)"
      (create)="onCreate()"
      (preview)="openPreview()"
      (applySettings)="onApplyPreset($event)"
    >
      <app-generate-source-image
        generateSourceImage
        [form]="form"
        [showValidation]="sourceValidationVisible()"
        [remixSupported]="remixSupported()"
        (stateChange)="onSourceState($event)"
      />
    </app-generate-form>
  </section>

  <!-- Right: results pane -->
  <section
    #resultsPane
    id="generate-results"
    class="gs-results"
    tabindex="-1"
    [attr.aria-label]="'generate.results.heading' | transloco"
  >
    <app-generate-results-panel
      class="gs-fill"
      [formValue]="formValue()"
      (applyMeta)="onApplyMeta($event)"
      (useAsSource)="onUseAsSource($event)"
      (usePrompt)="onUsePrompt($event)"
    />
  </section>

  @if (imageDrop.dragActive()) {
    <!-- Pointer-driven and transient: a screen-reader user never triggers a drag,
         and the paste route needs no visual affordance. -->
    <div class="gs-dropzone" aria-hidden="true">
      <div class="gs-dropzone-card">
        <app-icon name="photo" />
        <span>{{ "generate.source.drop_hint" | transloco }}</span>
      </div>
    </div>
  }

  <!-- The mobile half of the reference entry. The docked half lives in the
       results pane and the two are mounted separately, because one element
       cannot be both a pane child and a fixed sheet; CSS shows exactly one of
       them, so the reader never meets the entry twice. -->
  @if (helpDock.topic(); as topic) {
    <app-gs-sheet
      #helpSheet
      [startExpanded]="true"
      [label]="'generate.help.sheet_label' | transloco"
      (closed)="helpDock.close()"
    >
      <span sheet-bar class="gs-sheet-title">
        {{ "generate.help." + topic + ".title" | transloco }}
      </span>
      <app-gs-param-entry
        [topic]="topic"
        mode="dock"
        (applied)="helpSheet.collapse()"
      />
    </app-gs-sheet>
  }

  @if (previewRequest(); as request) {
    <app-studio-json-modal
      [title]="'generate.form.preview_title' | transloco"
      [data]="request"
      (closed)="closePreview()"
    />
  }

  @if (pendingLoadRequest(); as request) {
    <!-- A preset is reviewed the same way a past generation's settings are: the
         same panel, a sheet on phones and a centred panel on desktop. -->
    <div
      class="gs-meta-host"
      (click)="onLoadBackdrop($event)"
      (keydown.escape)="cancelLoad()"
      tabindex="0"
    >
      <app-image-meta-panel
        #presetMeta
        [request]="request"
        [currentValue]="formValue()"
        [titleKey]="loadTitleKey()"
        [pinnable]="false"
        [defaultMode]="'replace'"
        (apply)="onApplyPresetSelection($event, presetMeta.offeredKeys())"
        (rawJson)="previewRequest.set(request)"
        (closed)="cancelLoad()"
      />
    </div>
  }
</div>
