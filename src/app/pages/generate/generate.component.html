<div
  class="gen-studio gs-workspace"
  [class.gs-workspace--full]="!embedded()"
  [class.gs-workspace--wide]="!embedded() && panelSize() === 'double'"
  [class.gs-workspace--max]="!embedded() && panelSize() === 'full'"
  appStudioImageDrop
  #imageDrop="studioImageDrop"
  (imageFile)="onDroppedImage($event)"
  (rejected)="onRejectedImage()"
>
  <!-- Keyboard users land in the control panel first; the results pane is a long
       scroll away past every setting, so it gets a skip link. -->
  <a class="gs-skip" href="#generate-results" (click)="skipToResults($event)">
    {{ "generate.skip_to_results" | transloco }}
  </a>

  <!-- Left: control panel -->
  <section class="gs-panel">
    <app-generate-form
      class="gs-fill"
      [form]="form"
      [models]="models()"
      [kudos]="kudos()"
      [estimating]="estimating()"
      [forcedParams]="forcedParams()"
      [styleGroups]="styleGroups()"
      [panelSize]="panelSize()"
      [expandable]="!embedded()"
      [promptHistory]="promptHistory()"
      (panelSizeChange)="panelSize.set($event)"
      (create)="onCreate()"
      (preview)="openPreview()"
      (applySettings)="onApplyPreset($event)"
    >
      <app-generate-source-image
        generateSourceImage
        [form]="form"
        [showValidation]="sourceValidationVisible()"
        (stateChange)="onSourceState($event)"
      />
    </app-generate-form>
  </section>

  <!-- Right: results pane -->
  <section
    #resultsPane
    id="generate-results"
    class="gs-results"
    tabindex="-1"
    [attr.aria-label]="'generate.results.heading' | transloco"
  >
    <app-generate-results-panel
      class="gs-fill"
      [formValue]="formValue()"
      (applyMeta)="onApplyMeta($event)"
      (useAsSource)="onUseAsSource($event)"
      (usePrompt)="onUsePrompt($event)"
    />
  </section>

  @if (imageDrop.dragActive()) {
    <!-- Pointer-driven and transient: a screen-reader user never triggers a drag,
         and the paste route needs no visual affordance. -->
    <div class="gs-dropzone" aria-hidden="true">
      <div class="gs-dropzone-card">
        <app-icon name="photo" />
        <span>{{ "generate.source.drop_hint" | transloco }}</span>
      </div>
    </div>
  }

  @if (previewRequest(); as request) {
    <app-studio-json-modal
      [title]="'generate.form.preview_title' | transloco"
      [data]="request"
      (closed)="closePreview()"
    />
  }

  @if (loadConfirmOpen()) {
    <div
      class="gs-modal-overlay"
      (click)="onLoadBackdrop($event)"
      (keydown.escape)="cancelLoad()"
      role="dialog"
      aria-modal="true"
      tabindex="0"
    >
      <div class="gs-modal-panel gs-modal-panel--sm gs-fadeup">
        <div class="gs-modal-header">
          <div class="gs-modal-title">
            <app-icon name="arrow-down-tray" class="gs-ico-sm" />
            {{ "generate.form.load_confirm_title" | transloco }}
          </div>
        </div>
        <div class="gs-modal-body">
          <p class="gs-confirm-text">
            {{ "generate.form.load_confirm_body" | transloco }}
          </p>
        </div>
        <div class="gs-modal-footer">
          <button type="button" class="gs-tile-btn" (click)="cancelLoad()">
            {{ "generate.form.load_confirm_cancel" | transloco }}
          </button>
          <button type="button" class="gs-modal-done" (click)="confirmLoad()">
            {{ "generate.form.load_confirm_action" | transloco }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
