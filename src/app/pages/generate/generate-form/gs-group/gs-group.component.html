<section
  class="gs-group {{ identity().className }}"
  [class.gs-group--open]="open()"
>
  <!-- The head is a row rather than a single control: the press that opens the
       group takes all of it bar the end, where the group's own notes and
       actions sit as their own controls. Nesting them in the opening press
       would leave them unreachable; leaving them inside the body stranded them
       on a line of their own above the first field.

       They belong to the open group, though. Folded, the head is a line of
       values, and a control competing with that line reads as one more thing
       to decide before the group has even been opened. -->
  <div class="gs-group-head">
    <button
      type="button"
      class="gs-group-toggle"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="bodyId"
      (click)="toggled.emit()"
    >
      <app-icon
        class="gs-chev gs-group-chev"
        [name]="open() ? 'chevron-down' : 'chevron-right'"
      />
      <span class="gs-sec-chip" aria-hidden="true">
        <app-icon [name]="identity().icon" />
      </span>
      <span class="gs-group-name">{{ titleKey() | transloco }}</span>
      <!-- An open group is showing the controls its summary would describe, so
         the line stands down and leaves the head to the actions. -->
      @if (summary() && !open()) {
        <span class="gs-group-sum gs-mono">{{ summary() }}</span>
      }
      @if (changed()) {
        <span
          class="gs-group-dot"
          role="img"
          [attr.aria-label]="'generate.groups.changed' | transloco"
        ></span>
      }
    </button>
    @if (open()) {
      <ng-content select="[groupActions]" />
    }
  </div>
  @if (open()) {
    <div [id]="bodyId" class="gs-group-body">
      <ng-content />
    </div>
  }
</section>
