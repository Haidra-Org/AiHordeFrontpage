<div
  class="gs-modal-overlay gs-modal-overlay--json"
  (click)="onBackdrop($event)"
  (keydown.escape)="close()"
  role="dialog"
  aria-modal="true"
  tabindex="0"
>
  <div class="gs-modal-panel gs-fadeup">
    <div class="gs-modal-header">
      <div class="gs-modal-title">
        <app-icon name="code-bracket" class="gs-ico-sm" />
        {{ title() }}
      </div>
      <button
        type="button"
        class="gs-modal-close"
        (click)="close()"
        [attr.aria-label]="'generate.results.close' | transloco"
      >
        <app-icon name="x-mark" class="gs-ico-sm" />
      </button>
    </div>

    <div class="gs-modal-body gs-api-body">
      @if (highlights().length > 0) {
        <div class="gs-meta-highlights">
          @for (row of highlights(); track row.label) {
            <div class="gs-meta-row gs-meta-row--{{ row.tone ?? 'default' }}">
              <span class="gs-meta-label">{{ row.label }}</span>
              <span class="gs-meta-value">{{ row.value }}</span>
            </div>
          }
        </div>
      }
      <pre class="gs-api-code"><code [innerHTML]="highlighted()"></code></pre>
      @if (payloadNote()) {
        <p class="gs-modal-foot-note">{{ payloadNote() }}</p>
      }
    </div>

    <div class="gs-modal-footer">
      <span class="gs-modal-foot-note">
        {{ note() }}
      </span>
      <div class="flex max-w-full flex-wrap items-center justify-end gap-2">
        @if (fullPayloadAvailable()) {
          <button
            type="button"
            class="gs-tile-btn"
            [disabled]="fullPayloadDownloading()"
            (click)="downloadFullPayload.emit()"
          >
            <app-icon name="arrow-down-tray" />
            {{ "generate.results.payload_download" | transloco }}
          </button>
        }
        @if (downloadName()) {
          <button type="button" class="gs-tile-btn" (click)="download()">
            <app-icon name="arrow-down-tray" />
            {{ "generate.results.metadata_download" | transloco }}
          </button>
        }
        <button type="button" class="gs-modal-done" (click)="copy()">
          {{ "generate.results.metadata_copy" | transloco }}
        </button>
      </div>
    </div>
  </div>
</div>
