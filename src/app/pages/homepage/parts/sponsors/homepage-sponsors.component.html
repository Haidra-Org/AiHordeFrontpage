<section class="home-section home-credits" scrollReveal>
  <div class="home-section-inner">
    <div>
      <h2 class="home-section-title">
        {{ "homepage.sponsors.title" | transloco }}
      </h2>
      <p class="home-credits-text">
        {{ "homepage.sponsors.funding" | transloco }}
        {{ "homepage.sponsors.run_by_prefix" | transloco }}
        <a
          href="https://haidra.net"
          target="_blank"
          rel="noreferrer noopener"
          class="link external-link"
          >{{ "homepage.sponsors.haidra_link" | transloco }}</a
        >{{ "homepage.sponsors.run_by_suffix" | transloco }}
        <a routerLink="/mission" class="link">{{
          "homepage.sponsors.mission_link" | transloco
        }}</a>
      </p>
    </div>
    <a
      href="https://nlnet.nl/project/AI-Horde/"
      target="_blank"
      rel="noreferrer noopener"
      class="home-credits-mark"
      [attr.aria-label]="'homepage.sponsors.nlnet_link' | transloco"
    >
      <inline-svg href="assets/img/nlnet.svg" class="home-credits-svg" />
    </a>
  </div>
</section>
